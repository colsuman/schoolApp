<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Signup - Sunrise English Public School</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:#f4f4f4;
display:flex;
flex-direction:column;
min-height:100vh;
}

header{
background:#b30000;
color:white;
text-align:center;
padding:25px;
}

header h1{
font-size:38px;
}

nav{
display:flex;
justify-content:center;
align-items:center;
gap:30px;
background:#111;
padding:12px 0;
}

nav a{
color:white;
text-decoration:none;
font-size:16px;
font-weight:bold;
padding:5px 10px;
}

nav a:hover{
color:#ffcc00;
}

.main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
}

.signup-box{
background:white;
padding:30px;
width:380px;
border-radius:8px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
text-align:center;
}

.signup-box h2{
margin-bottom:20px;
color:#b30000;
}

.signup-box input,
.signup-box select{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:4px;
}

.signup-box button{
width:100%;
padding:10px;
background:#b30000;
color:white;
border:none;
border-radius:4px;
font-size:16px;
cursor:pointer;
}

.signup-box button:hover{
background:#800000;
}

.error{
color:red;
font-size:13px;
text-align:left;
}

footer{
background:#333;
color:white;
text-align:center;
padding:10px;
}

</style>

</head>

<body>

<header>
<h1>Sunrise English Public School</h1>
<p>CBSE Pattern English Medium</p>
</header>

<nav>
<a href="/home">Home</a>
<a href="/about">About</a>
</nav>

<div class="main">

<div class="signup-box">

<h2>Create Account</h2>

<form action="/signup" method="post" enctype="multipart/form-data" onsubmit="return validateForm()">

<select name="userType" id="userType">
<option value="">Select User Type</option>
<option value="STUDENT">Student</option>
<option value="TEACHER">Teacher</option>
<option value="DIRECTOR">Director</option>
</select>
<div class="error" id="userTypeError"></div>

<input type="text" id="name" name="name" placeholder="Full Name">
<div class="error" id="nameError"></div>

<input type="email" id="email" name="email" placeholder="Email">
<div class="error" id="emailError"></div>

<input type="text" id="mobileNo" name="mobileNo" placeholder="Mobile Number">
<div class="error" id="mobileError"></div>

<input type="text" id="username" name="username" placeholder="Username">
<div class="error" id="usernameError"></div>

<input type="password" id="password" name="password" placeholder="Password">
<div class="error" id="passwordError"></div>

<label style="display:block;text-align:left;margin-top:10px;">Upload Profile Picture</label>

<input type="file" id="profilePicFile" name="profilePicFile" accept="image/*">
<div class="error" id="imageError"></div>

<button type="submit">Signup</button>

</form>

</div>

</div>

<footer>
<p>© 2026 Sunrise English Public School</p>
</footer>

<script>

function validateForm(){

let valid = true;

document.querySelectorAll(".error").forEach(e => e.innerText="");

let userType = document.getElementById("userType").value;
if(userType === ""){
document.getElementById("userTypeError").innerText="Please select user type";
valid=false;
}

let name = document.getElementById("name").value.trim();
if(name === ""){
document.getElementById("nameError").innerText="Name is required";
valid=false;
}

let valid = true;

let mobile = document.getElementById("mobileNo").value.trim();
let mobileError = document.getElementById("mobileError");

// Clear previous error
mobileError.innerText = "";

// Empty check
if (mobile === "") {
    mobileError.innerText = "Mobile Number is required";
    valid = false;
}
// Format check (10 digit Indian number)
else if (!/^[6-9]\d{9}$/.test(mobile)) {
    mobileError.innerText = "Enter valid 10-digit mobile number";
    valid = false;
}

return valid;

/* EMAIL */ 
 
 let email = document.getElementById("email").value.trim(); 
 
 let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; if(email === "")
 {
	 document.getElementById("emailError").innerText="Email is required"; valid=false; 
	 }
 else if(!emailPattern.test(email)){
	 document.getElementById("emailError").innerText="Enter valid email"; valid=false; 
	 }

let username = document.getElementById("username").value.trim();
if(username.length < 4){
document.getElementById("usernameError").innerText="Username must be at least 4 characters";
valid=false;
}

let password = document.getElementById("password").value;
if(password.length < 6){
document.getElementById("passwordError").innerText="Password must be at least 6 characters";
valid=false;
}

/* IMAGE VALIDATION */

let image = document.getElementById("profilePicFile").files[0];

if(!image){
document.getElementById("imageError").innerText="Please upload profile picture";
valid=false;
}else{

let allowedTypes = ["image/jpeg","image/png","image/jpg"];

if(!allowedTypes.includes(image.type)){
document.getElementById("imageError").innerText="Only JPG or PNG images allowed";
valid=false;
}

if(image.size > 2 * 1024 * 1024){
document.getElementById("imageError").innerText="Image must be less than 2MB";
valid=false;
}

}

return valid;

}

</script>

</body>
</html>
