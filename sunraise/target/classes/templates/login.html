<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Sunrise English Public School</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:#f4f4f4;
display:flex;
flex-direction:column;
min-height:100vh;
}

/* HEADER */
header{
background:#b30000;
color:white;
text-align:center;
padding:25px;
}

header h1{
font-size:38px;
}

/* NAVIGATION */
nav{
display:flex;
justify-content:center;
align-items:center;
gap:30px;
background:#111;
padding:12px 0;
}

nav a{
color:white;
text-decoration:none;
font-size:16px;
font-weight:bold;
padding:5px 10px;
}

nav a:hover{
color:#ffcc00;
}

/* DROPDOWN */
.dropdown{
position:relative;
}

.dropdown-content{
display:none;
position:absolute;
background:white;
min-width:180px;
box-shadow:0 2px 6px rgba(0,0,0,0.3);
top:30px;
}

.dropdown-content a{
color:black;
display:block;
padding:10px;
}

.dropdown-content a:hover{
background:#eee;
}

.dropdown:hover .dropdown-content{
display:block;
}

/* MAIN AREA */
.main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
}

/* LOGIN BOX */
.login-box{
background:white;
padding:30px;
width:350px;
border-radius:8px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
text-align:center;
}

.login-box h2{
margin-bottom:20px;
color:#b30000;
}

.login-box input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:4px;
}

.login-box button{
width:100%;
padding:10px;
background:#b30000;
color:white;
border:none;
border-radius:4px;
font-size:16px;
cursor:pointer;
}

.login-box button:hover{
background:#800000;
}

/* MESSAGE BOX */

.success-message{
background:#d4edda;
color:#155724;
padding:10px;
margin-bottom:15px;
border-radius:5px;
font-weight:bold;
}

/* SIGNUP LINK */

.link{
margin-top:15px;
}

.link a{
color:#b30000;
text-decoration:none;
}

/* FOOTER */
footer{
background:#333;
color:white;
text-align:center;
padding:10px;
}

.error{
color:red;
font-size:13px;
text-align:left;
}

</style>

</head>

<body>

<!-- HEADER -->

<header>
<h1>Sunrise English Public School</h1>
<p>CBSE Pattern English Medium</p>
</header>

<!-- NAVIGATION -->

<nav>

<a href="/home">Home</a>
<a href="/about">About</a>

<div class="dropdown">
<a href="#">Facilities</a>

<div class="dropdown-content">
<a href="/director">Director</a>
<a href="/teachers">Teachers</a>
</div>

</div>

<div class="dropdown">
<a href="#">Admissions</a>

<div class="dropdown-content">
<a href="/admissionsForm">Admission Form</a>
<a href="/feeStructure">Fee Structure</a>
<a href="/documents">Required Documents</a>
</div>

</div>

<div class="dropdown">
<a href="/achievements">Achievements</a>

<div class="dropdown-content">
<a href="/result">Result</a>
<a href="/schoolAwards">School Awards</a>
</div>

</div>

<a href="/gallery">Gallery</a>

</nav>

<!-- MAIN LOGIN AREA -->

<div class="main">

<div class="login-box">

<h2>Login</h2>

<!-- SUCCESS MESSAGE -->

<div th:if="${message}" class="success-message">
<p th:text="${message}"></p>
</div>

<form action="/login" method="post" onsubmit="return validateForm()">

<input type="text" id="username" name="username" placeholder="Username">
<div class="error" id="usernameError"></div>

<input type="password" id="password" name="password" placeholder="Password">
<div class="error" id="passwordError"></div>

<button type="submit">Login</button>

</form>

<div class="link">
<a href="/forgotPwd">forgot password</a>
</div>

<div class="link">
<p>Don't have an account? <a href="/signup">Signup</a></p>
</div>

</div>

</div>

<!-- FOOTER -->

<footer>
<p>© 2026 Sunrise English Public School</p>
</footer>

<script>

function validateForm(){

let valid = true;

/* clear previous errors */
document.querySelectorAll(".error").forEach(e => e.innerText="");

/* USERNAME */
let username = document.getElementById("username").value.trim();

if(username === ""){
document.getElementById("usernameError").innerText="Username is required";
valid=false;
}
else if(username.length < 4){
document.getElementById("usernameError").innerText="Username must be at least 4 characters";
valid=false;
}

/* PASSWORD */

let password = document.getElementById("password").value;

if(password === ""){
document.getElementById("passwordError").innerText="Password is required";
valid=false;
}
else if(password.length < 6){
document.getElementById("passwordError").innerText="Password must be at least 6 characters";
valid=false;
}

return valid;

}

</script>

</body>
</html>
